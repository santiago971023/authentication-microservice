server:
  port: 8080

spring:
  application:
    name: auth-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/crediya_users
    username: postgres
    password: root
    pool:
      initial-size: 5
      max-size: 20

  # Opcional: Para ver las consultas SQL en consola (util para debug)
  logging:
    level:
      org.springframework.r2dbc: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
